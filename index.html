<script>
/* Commonplace — personal, local-first tasks and notes. No analytics or backend. */
(()=>{'use strict';
const KEY='commonplace.v1';
const $=s=>document.querySelector(s);
const id=()=>globalThis.crypto?.randomUUID?.()||String(Date.now())+Math.random().toString(36).slice(2);
const now=()=>new Date().toISOString();
const emptyState=()=>({version:1,projects:[],tasks:[],notes:[]});
function readState(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.tasks)&&Array.isArray(s.notes)&&Array.isArray(s.projects))return s}catch(e){console.warn('Unable to open saved notes',e)}return emptyState()}
let state=readState(),route=location.hash.slice(1)||'dashboard',taskFilter='active',projectTab='tasks',toastTimer,modalCleanup=null,activeRecorder=null,activeSpeech=null,activeVoiceBlob=null,voiceTranscript='';
const icons={home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',inbox:'<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 14h5l2 3h4l2-3h5"/>',check:'<path d="m5 12 4 4L19 6"/>',tasks:'<path d="m4 7 2 2 4-4M13 7h7M4 17l2 2 4-4M13 17h7"/>',notes:'<path d="M7 3h10a3 3 0 0 1 3 3v15H7a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3z"/><path d="M8 8h8M8 12h8M8 16h5"/>',projects:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 9h18M7 2v6M17 2v6"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/>',plus:'<path d="M12 4v16M4 12h16"/>',mic:'<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5M8 22h8"/>',arrow:'<path d="m9 18 6-6-6-6"/>',back:'<path d="m15 18-6-6 6-6"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.4-2-3.4-2.3.8a7 7 0 0 0-1.7-1L14.4 3h-4.8L9 6a7 7 0 0 0-1.7 1L5 6.2 3 9.6 5 11a7 7 0 0 0 0 2L3 14.4l2 3.4 2.3-.8a7 7 0 0 0 1.7 1l.6 3h4.8l.6-3a7 7 0 0 0 1.7-1l2.3.8 2-3.4-2-1.4a7 7 0 0 0 .1-1z"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14M10 11v6M14 11v6"/>',link:'<path d="M10 13a5 5 0 0 0 7 .5l3-3a5 5 0 0 0-7-7l-1.7 1.7M14 11a5 5 0 0 0-7-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',spark:'<path d="m12 3 1.8 6.2L20 11l-6.2 1.8L12 19l-1.8-6.2L4 11l6.2-1.8zM19 17v5M16.5 19.5h5"/>',close:'<path d="M5 5l14 14M19 5 5 19"/>',archive:'<path d="M4 4h16v5H4zM6 9v12h12V9M10 13h4"/>',download:'<path d="M12 3v13m-5-5 5 5 5-5M4 18v3h16v-3"/>',upload:'<path d="M12 21V8m-5 5 5-5 5 5M4 6V3h16v3"/>'};
const ico=(name,size=18)=>`<svg viewBox="0 0 24 24" width="${size}" height="${size}" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]||icons.notes}</svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const preview=s=>String(s||'').replace(/<[^>]*>/g,' ').replace(/&nbsp;/g,' ').replace(/\s+/g,' ').trim();
const date=s=>{try{return new Date(s).toLocaleDateString(undefined,{month:'short',day:'numeric'})}catch{return ''}};
const projectBy=id=>state.projects.find(p=>p.id===id);
const taskBy=id=>state.tasks.find(t=>t.id===id);
const noteBy=id=>state.notes.find(n=>n.id===id);
const projectName=id=>projectBy(id)?.name||'Inbox';
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){showToast('Storage full or unavailable. Export a backup in Settings.');return false}};
const modify=fn=>{fn();save();render()};
function notifyToast(m){const t=$('#toast');t.textContent=m;t.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('visible'),2700)}
const showToast=notifyToast;
function go(path){closeModal();location.hash=path;route=path;render();window.scrollTo(0,0)}
function navItem(key,label,icon){return `<button class="nav-item ${route===key?'active':''}" data-nav="${key}" aria-label="${label}">${ico(icon)}<span>${label}</span></button>`}
function desktopItem(key,label,icon){return `<button class="sideitem ${route===key?'active':''}" data-nav="${key}">${ico(icon)}${label}</button>`}
function shell(body){$('#app').innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand"><span class="mark">≋</span> commonplace</div><nav>${desktopItem('dashboard','Home','home')}${desktopItem('inbox','Inbox','inbox')}${desktopItem('tasks','Tasks','tasks')}${desktopItem('notes','Notes','notes')}${desktopItem('projects','Projects','projects')}${desktopItem('search','Search','search')}</nav><div class="side-bottom">${desktopItem('settings','Settings & backup','gear')}<div class="info-inline" style="padding:11px 14px">Private to this browser</div></div></aside><main class="main"><div class="topline"><div class="brand"><span class="mark">≋</span> commonplace</div><button class="iconbtn" data-nav="settings" aria-label="Settings">${ico('gear')}</button></div>${body}<div class="bottomspace"></div></main><nav class="bottom-nav" aria-label="Main navigation">${navItem('dashboard','Home','home')}${navItem('inbox','Inbox','inbox')}${navItem('tasks','Tasks','tasks')}<button class="nav-center" data-action="capture" aria-label="Create task or note">${ico('plus',24)}</button>${navItem('notes','Notes','notes')}${navItem('projects','Projects','projects')}</nav></div>`}
function section(title,key,content,count){return `<div class="section-head"><h2 class="section-title">${title} ${count!==undefined?`<span class="count">${count}</span>`:''}</h2><button class="small-action" data-nav="${key}">View all ${ico('arrow',14)}</button></div>${content}`}
function taskRow(t){return `<div class="item-row" data-action="open-task" data-id="${esc(t.id)}" role="button" tabindex="0"><button class="check ${t.done?'checked':''}" data-action="toggle-task" data-id="${esc(t.id)}" aria-label="${t.done?'Mark incomplete':'Mark complete'}"></button><div class="item-body"><div class="item-title ${t.done?'done-text':''}">${esc(t.title)}</div><div class="item-sub">${t.subtasks?.length?`${t.subtasks.filter(s=>s.done).length}/${t.subtasks.length} subtasks · `:''}${esc(projectName(t.projectId))}</div></div><span class="item-right">${ico('arrow',16)}</span></div>`}
function noteRow(n){return `<div class="item-row" data-action="open-note" data-id="${esc(n.id)}" role="button" tabindex="0"><span class="note-icon">${ico('notes',16)}</span><div class="item-body"><div class="item-title">${esc(n.title||'Untitled note')}</div><div class="item-sub">${esc(preview(n.content).slice(0,100)|| (n.audioId?'Voice recording':projectName(n.projectId)))}</div></div><span class="item-right">${date(n.updatedAt)}</span></div>`}
function empty(message,icon='inbox'){return `<div class="empty"><div class="empty-illus">${ico(icon,21)}</div>${esc(message)}</div>`}
function mixed(items){return items.length?`<div class="card">${items.map(x=>x.kind==='task'?taskRow(x.data):noteRow(x.data)).join('')}</div>`:`<div class="card">${empty('Nothing here yet. Capture your first task or note.')}</div>`}
function recent(items,n=5){return items.sort((a,b)=>String(b.data.updatedAt||b.data.createdAt).localeCompare(String(a.data.updatedAt||a.data.createdAt))).slice(0,n)}
function dashboard(){const all=recent([...state.tasks.filter(t=>!t.projectId).map(data=>({kind:'task',data})),...state.notes.filter(n=>!n.projectId).map(data=>({kind:'note',data}))]);const active=state.tasks.filter(t=>!t.done);return `<div class="dashboard-hero"><div class="eyebrow">Your personal space</div><h1 class="greet">A little more clarity,<br>every day.</h1><p class="lede">A quiet home for the things you want to do and remember.</p></div><div class="capture"><button class="capture-top" data-action="capture">${ico('spark')}<span>What's on your mind?</span></button><div class="capture-actions"><button class="btn" data-action="new-task">${ico('plus',15)} Task</button><button class="btn" data-action="new-note">${ico('notes',15)} Note</button><button class="btn" data-action="voice">${ico('mic',15)} Voice</button></div></div><div class="statrow"><div class="statcard" data-nav="tasks"><span class="stat-icon">${ico('tasks',17)}</span><div class="statnum">${active.length}</div><div class="statlabel">Open tasks</div></div><div class="statcard" data-nav="notes"><span class="stat-icon" style="background:#f6f0e3;color:#9a8252">${ico('notes',17)}</span><div class="statnum">${state.notes.length}</div><div class="statlabel">Notes saved</div></div><div class="statcard" data-nav="projects"><span class="stat-icon" style="background:#efecf7;color:#76658b">${ico('projects',17)}</span><div class="statnum">${state.projects.length}</div><div class="statlabel">Projects</div></div></div>${section('Inbox','inbox',mixed(all),all.length)}${section('Recent notes','notes',state.notes.length?`<div class="card">${[...state.notes].sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt)).slice(0,3).map(noteRow).join('')}</div>`:`<div class="card">${empty('Your ideas and research will appear here.','notes')}</div>`)}${section('Your projects','projects',state.projects.length?projectCards(state.projects.slice(0,4)):`<div class="card">${empty('Projects keep related tasks and notes together.','projects')}</div>`,state.projects.length)}`}
function pageHead(k,title,desc,btn=''){return `<div class="pagehead"><div class="eyebrow">${k}</div><h1>${title}</h1><p>${desc}</p></div>${btn?`<div class="toolbar">${btn}</div>`:''}`}
function inbox(){const items=recent([...state.tasks.filter(t=>!t.projectId).map(data=>({kind:'task',data})),...state.notes.filter(n=>!n.projectId).map(data=>({kind:'note',data}))],9999);return pageHead('Everything starts here','Inbox','Capture first, organize later.',`<button class="btn primary" data-action="capture">${ico('plus',16)} Capture</button>`)+mixed(items)}
function tasksPage(){const ts=[...state.tasks].filter(t=>taskFilter==='active'?!t.done:taskFilter==='completed'?t.done:true).sort((a,b)=>String(b.updatedAt).localeCompare(String(a.updatedAt)));return pageHead('Make it happen','Tasks','Your plans, big and small.',`<div class="tabs">${['active','completed','all'].map(k=>`<button class="${taskFilter===k?'active':''}" data-action="filter-task" data-id="${k}">${k[0].toUpperCase()+k.slice(1)}</button>`).join('')}</div><button class="btn primary" data-action="new-task">${ico('plus',15)} New task</button>`)+`<div class="card">${ts.length?ts.map(taskRow).join(''):empty('No tasks in this view.','tasks')}</div>`}
function notesPage(){const ns=[...state.notes].sort((a,b)=>String(b.updatedAt).localeCompare(String(a.updatedAt)));return pageHead('Thoughts worth keeping','Notes','Ideas, research and things to remember.',`<button class="btn primary" data-action="new-note">${ico('plus',15)} New note</button>`)+`<div class="card">${ns.length?ns.map(noteRow).join(''):empty('A note can start with just one thought.','notes')}</div>`}
function projectCards(ps){return `<div class="project-grid">${ps.map((p,i)=>{const ts=state.tasks.filter(t=>t.projectId===p.id),ns=state.notes.filter(n=>n.projectId===p.id),ratio=ts.length?100*ts.filter(t=>t.done).length/ts.length:0;return `<button class="project-card" data-nav="project/${esc(p.id)}"><div class="project-initial" style="${i%4===1?'background:#e8f2ec;color:#527761':i%4===2?'background:#eeeaf5;color:#76638d':i%4===3?'background:#f6eced;color:#986670':''}">${esc(p.name.slice(0,1).toUpperCase())}</div><div class="project-name">${esc(p.name)}</div><div class="project-meta">${ts.length} tasks · ${ns.length} notes</div><div class="progress"><span style="width:${ratio}%"></span></div></button>`}).join('')}</div>`}
function projectsPage(){return pageHead('Keep things together','Projects','Organize your longer-term goals and interests.',`<button class="btn primary" data-action="new-project">${ico('plus',15)} New project</button>`)+(state.projects.length?projectCards(state.projects):`<div class="card">${empty('Create a project to give related tasks and notes a home.','projects')}</div>`)}
function projectDetail(pid){const p=projectBy(pid);if(!p)return notFound();const ts=state.tasks.filter(t=>t.projectId===pid).sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt)),ns=state.notes.filter(n=>n.projectId===pid).sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt));return `<div class="detail-header"><button class="back" data-nav="projects">${ico('back')} Projects</button><button class="btn" data-action="edit-project" data-id="${esc(pid)}">Edit project</button></div><div class="pagehead"><div class="eyebrow">Project</div><h1>${esc(p.name)}</h1><p>${esc(p.description||'Your tasks and notes, together.')}</p></div><div class="toolbar"><div class="tabs"><button class="${projectTab==='tasks'?'active':''}" data-action="project-tab" data-id="tasks">Tasks (${ts.length})</button><button class="${projectTab==='notes'?'active':''}" data-action="project-tab" data-id="notes">Notes (${ns.length})</button></div><button class="btn primary" data-action="${projectTab==='tasks'?'new-task':'new-note'}" data-project="${esc(pid)}">${ico('plus',15)} ${projectTab==='tasks'?'Task':'Note'}</button></div><div class="card">${projectTab==='tasks'?(ts.length?ts.map(taskRow).join(''):empty('No tasks in this project yet.','tasks')):(ns.length?ns.map(noteRow).join(''):empty('No notes in this project yet.','notes'))}</div>`}

function taskDetail(tid){const t=taskBy(tid);if(!t)return notFound();const ns=(t.noteIds||[]).map(noteBy).filter(Boolean);return `<div class="detail-header">${detailBack()}<button class="btn danger" data-action="delete-task" data-id="${esc(tid)}">${ico('trash',15)} Delete</button></div><div class="detail-panel"><div class="row" style="align-items:flex-start"><button class="check ${t.done?'checked':''}" data-action="toggle-task" data-id="${esc(tid)}" style="margin-top:8px" aria-label="Toggle completed"></button><textarea class="plain-title" rows="1" id="task-title" aria-label="Task title" placeholder="Task title">${esc(t.title)}</textarea></div><span class="pill">${t.done?'Completed':'To do'}</span><div class="fieldlabel">Description</div><textarea class="plain-textarea" id="task-description" placeholder="Add some details...">${esc(t.description||'')}</textarea><label class="fieldlabel" for="detail-project">Project</label>${projectSelect(t.projectId)}<div class="section-head"><h2 class="section-title">Subtasks <span class="count">${(t.subtasks||[]).filter(x=>x.done).length}/${(t.subtasks||[]).length}</span></h2></div><div id="subtask-list">${(t.subtasks||[]).map((s,i)=>`<div class="subtask"><button class="check ${s.done?'checked':''}" data-action="toggle-subtask" data-id="${esc(t.id)}" data-sub="${esc(s.id)}" aria-label="Toggle subtask"></button><input value="${esc(s.text)}" data-edit-sub="${esc(s.id)}" aria-label="Subtask" style="${s.done?'text-decoration:line-through;opacity:.6':''}"><div class="subtask-controls"><button class="tinybtn" data-action="move-sub" data-id="${esc(t.id)}" data-sub="${esc(s.id)}" data-dir="-1" title="Move up" aria-label="Move subtask up">↑</button><button class="tinybtn" data-action="move-sub" data-id="${esc(t.id)}" data-sub="${esc(s.id)}" data-dir="1" title="Move down" aria-label="Move subtask down">↓</button><button class="tinybtn" data-action="remove-sub" data-id="${esc(t.id)}" data-sub="${esc(s.id)}" title="Remove subtask" aria-label="Remove subtask">×</button></div></div>`).join('')}</div><div class="row" style="margin-top:13px"><input class="form-input" id="new-subtask" placeholder="Add a subtask..." aria-label="New subtask"><button class="btn soft" data-action="add-subtask" data-id="${esc(tid)}">Add</button></div><div class="section-head"><h2 class="section-title">Linked notes <span class="count">${ns.length}</span></h2><button class="small-action" data-action="link-note" data-id="${esc(tid)}">${ico('plus',14)} Link note</button></div>${ns.length?`<div>${ns.map(n=>`<span class="linkchip"><a href="#note/${esc(n.id)}">${esc(n.title||'Untitled note')}</a><button data-action="unlink-note" data-id="${esc(tid)}" data-note="${esc(n.id)}" title="Unlink">×</button></span>`).join('')}</div>`:`<div class="nolist">No linked notes yet.</div>`}<button class="btn" data-action="linked-new-note" data-id="${esc(tid)}" style="margin-top:12px">${ico('notes',15)} Write a linked note</button><p class="info-inline">Changes are saved automatically · Updated ${date(t.updatedAt)}</p></div>`}
function sanitizeHtml(html){const d=new DOMParser().parseFromString('<div id="safe">'+String(html||'')+'</div>','text/html');const root=d.getElementById('safe');if(!root)return '';const allowed=new Set('P BR DIV SPAN STRONG B EM I U S STRIKE H1 H2 H3 UL OL LI A BLOCKQUOTE'.split(' '));function clean(node){for(const child of Array.from(node.childNodes)){if(child.nodeType===8){child.remove();continue}if(child.nodeType===3)continue;if(child.nodeType!==1){child.remove();continue}if(!allowed.has(child.tagName)){if(['SCRIPT','STYLE','IFRAME','OBJECT','SVG','FORM','IMG','VIDEO','AUDIO','INPUT','TEXTAREA','BUTTON'].includes(child.tagName)){child.remove();continue}const fragment=d.createDocumentFragment();while(child.firstChild)fragment.appendChild(child.firstChild);child.replaceWith(fragment);clean(node);continue}const attr=Array.from(child.attributes);for(const a of attr){const ok=(child.tagName==='A'&&a.name==='href')||(child.tagName==='UL'&&a.name==='class'&&a.value==='checklist')||(child.tagName==='LI'&&a.name==='data-done'&&['true','false'].includes(a.value));if(!ok)child.removeAttribute(a.name)}if(child.tagName==='A'){let href=child.getAttribute('href')||'';if(!/^https?:\/\//i.test(href)&&!/^mailto:/i.test(href)&&!href.startsWith('#'))child.removeAttribute('href');child.setAttribute('rel','noopener noreferrer');child.setAttribute('target','_blank')}clean(child)}}clean(root);return root.innerHTML}
function noteDetail(nid){const n=noteBy(nid);if(!n)return notFound();const ts=state.tasks.filter(t=>(t.noteIds||[]).includes(nid));return `<div class="detail-header">${detailBack()}<button class="btn danger" data-action="delete-note" data-id="${esc(nid)}">${ico('trash',15)} Delete</button></div><div class="detail-panel"><textarea class="plain-title" id="note-title" rows="1" aria-label="Note title" placeholder="Untitled note">${esc(n.title||'')}</textarea><label class="fieldlabel" for="detail-project">Project</label>${projectSelect(n.projectId)}${n.audioId?`<div class="fieldlabel">Voice recording</div><div id="audio-holder" class="voice-status">Loading audio...</div>`:''}<div class="editor-toolbar" aria-label="Text formatting"><button data-format="bold" title="Bold" aria-label="Bold"><b>B</b></button><button data-format="italic" title="Italic" aria-label="Italic"><i>I</i></button><button data-format="underline" title="Underline" aria-label="Underline"><u>U</u></button><button data-format="h2" title="Heading" aria-label="Heading">H</button><button data-format="insertUnorderedList" title="Bullets" aria-label="Bulleted list">≡</button><button data-format="insertOrderedList" title="Numbered list" aria-label="Numbered list">1.</button><button data-format="checklist" title="Checklist" aria-label="Checklist">☑</button><button data-format="link" title="Insert link" aria-label="Insert link">${ico('link',15)}</button><button data-format="undo" title="Undo">↶</button><button data-format="redo" title="Redo">↷</button><button data-action="selection-to-task" data-id="${esc(nid)}" title="Select text, then make a linked task" style="width:auto;padding:0 10px;font-size:12px;color:#355b44">+ Task from text</button></div><div id="note-editor" class="editor" contenteditable="true" role="textbox" aria-label="Note content" aria-multiline="true" data-placeholder="Start writing..."><!--note-body--></div><div class="section-head"><h2 class="section-title">Linked tasks <span class="count">${ts.length}</span></h2><button class="small-action" data-action="link-task" data-id="${esc(nid)}">${ico('plus',14)} Link task</button></div>${ts.length?`<div>${ts.map(t=>`<span class="linkchip"><a href="#task/${esc(t.id)}">${esc(t.title)}</a><button data-action="unlink-task" data-id="${esc(t.id)}" data-note="${esc(nid)}" title="Unlink">×</button></span>`).join('')}</div>`:`<div class="nolist">No linked tasks yet. Select note text to create one.</div>`}<p class="info-inline" id="note-save-status">Autosaved · Updated ${date(n.updatedAt)}</p></div>`}
function notFound(){return pageHead('Not found','Item not found','It may have been deleted.')+'<button class="btn" data-nav="dashboard">Go home</button>'}
function searchPage(){return pageHead('Find what matters','Search','Search all your tasks, notes and projects.')+`<div class="searchbox">${ico('search')}<input id="search-input" placeholder="Search everything..." autocomplete="off" aria-label="Search everything"></div><div id="search-results" style="margin-top:22px"></div>`}
function searchResults(q){const div=$('#search-results');if(!div)return;const v=q.trim().toLowerCase();if(!v){div.innerHTML=`<div class="card">${empty('Type a word or phrase to search your space.','search')}</div>`;return}const ts=state.tasks.filter(t=>[t.title,t.description,...(t.subtasks||[]).map(s=>s.text)].join(' ').toLowerCase().includes(v)),ns=state.notes.filter(n=>[n.title,preview(n.content)].join(' ').toLowerCase().includes(v)),ps=state.projects.filter(p=>[p.name,p.description].join(' ').toLowerCase().includes(v));div.innerHTML=`<div class="group-label">Tasks (${ts.length})</div><div class="card">${ts.length?ts.map(taskRow).join(''):empty('No matching tasks.','tasks')}</div><div class="group-label">Notes (${ns.length})</div><div class="card">${ns.length?ns.map(noteRow).join(''):empty('No matching notes.','notes')}</div><div class="group-label">Projects (${ps.length})</div>${ps.length?projectCards(ps):`<div class="card">${empty('No matching projects.','projects')}</div>`}`}
function settingsPage(){return pageHead('Own your information','Settings & backup','Your information belongs to you.')+`<div class="notice"><b>Local-first storage.</b> Notes and tasks are saved in this browser on this device. They do not sync automatically, and clearing browser data can erase them. Export backups regularly. There is no account or subscription.</div><div class="settings-card"><h3>Export your data</h3><p>Download all your projects, tasks and notes as a JSON backup, including audio attachments.</p><button class="btn primary" data-action="export">${ico('download',15)} Download backup</button></div><div class="settings-card"><h3>Restore a backup</h3><p>Import a previous Commonplace backup. This replaces the data currently in this browser.</p><button class="btn" data-action="import">${ico('upload',15)} Choose backup file</button><input id="import-file" type="file" accept=".json,application/json" hidden></div><div class="settings-card"><h3>Storage and privacy</h3><p>No tracking, analytics, third-party AI calls or external database. Quick capture uses private, on-device rules to suggest a task or note. Voice transcription is offered through browser speech features where available.</p><p>${state.tasks.length} tasks · ${state.notes.length} notes · ${state.projects.length} projects</p></div><div class="settings-card"><h3>Clear all data</h3><p>Delete everything stored by this app in this browser. Export a backup first.</p><button class="btn danger" data-action="clear-all">${ico('trash',15)} Erase all data</button></div>`}
function render(){route=location.hash.slice(1)||'dashboard';const [part,pid]=route.split('/');let body;if(part==='dashboard')body=dashboard();else if(part==='inbox')body=inbox();else if(part==='tasks')body=tasksPage();else if(part==='notes')body=notesPage();else if(part==='projects')body=projectsPage();else if(part==='project')body=projectDetail(pid);else if(part==='task')body=taskDetail(pid);else if(part==='note')body=noteDetail(pid);else if(part==='search')body=searchPage();else if(part==='settings')body=settingsPage();else body=notFound();shell(body);if(part==='note'){const ed=$('#note-editor');ed.innerHTML=sanitizeHtml(noteBy(pid)?.content||'');if(noteBy(pid)?.audioId)showNoteAudio(noteBy(pid).audioId)}if(part==='search'){const inp=$('#search-input');inp.value=searchQ;searchResults(searchQ)}}
let searchQ='';
function newTask(text='',projectId='',linkedNoteId=null){const t={id:id(),title:text.trim()||'New task',description:'',done:false,projectId:projectId||null,subtasks:[],noteIds:linkedNoteId?[linkedNoteId]:[],createdAt:now(),updatedAt:now()};state.tasks.unshift(t);save();return t}
function newNote(title='',content='',projectId='',linkedTaskId=null,voiceId=null){const n={id:id(),title:title.trim()||'Untitled note',content:sanitizeHtml(content),projectId:projectId||null,createdAt:now(),updatedAt:now(),audioId:voiceId||null};state.notes.unshift(n);if(linkedTaskId){const t=taskBy(linkedTaskId);if(t){t.noteIds=t.noteIds||[];t.noteIds.push(n.id)}}save();return n}
const touch=obj=>obj.updatedAt=now();
function closeModal(){if(modalCleanup){modalCleanup();modalCleanup=null}$('#modal-root').innerHTML=''}
function showModal(title,body){closeModal();$('#modal-root').innerHTML=`<div class="overlay" id="modal-overlay"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modalhead"><h2>${esc(title)}</h2><button class="iconbtn" data-action="close-modal" aria-label="Close">${ico('close')}</button></div>${body}</div></div>`;$('#modal-overlay').addEventListener('click',e=>{if(e.target.id==='modal-overlay')closeModal()})}
function newProjectDialog(p=null){showModal(p?'Edit project':'New project',`<div class="formrow"><label for="project-name">Project name</label><input class="form-input" id="project-name" maxlength="100" placeholder="e.g. Learn AI" value="${esc(p?.name||'')}"></div><div class="formrow"><label for="project-description">Description (optional)</label><textarea class="plain-textarea" id="project-description" placeholder="What's this project about?">${esc(p?.description||'')}</textarea></div><div class="modalfooter">${p?`<button class="btn danger" data-action="delete-project" data-id="${esc(p.id)}">Delete project</button>`:''}<button class="btn primary" data-action="save-project" data-id="${esc(p?.id||'')}">${p?'Save changes':'Create project'}</button></div>`);$('#project-name').focus()}
function inferType(s){const str=s.trim().toLowerCase();if(/^(buy|call|book|schedule|send|finish|complete|pay|renew|fix|research|read|pick up|order|email|review|plan|make|submit|check|remember to|need to|i need to|todo|to-do|task:)\b/.test(str))return 'task';if(/\b(i need to|must do|don't forget|have to)\b/.test(str))return 'task';return 'note'}
function suggestedTitle(s){const text=String(s||'').replace(/\s+/g,' ').trim();const line=text.split(/[.!?]\s/)[0];return (line.length>75?line.slice(0,72).trim()+'…':line)||''}
function captureDialog(type='auto',projectId=''){let selectedType=type==='auto'?'note':type;showModal(type==='auto'?'Quick capture':type==='task'?'New task':'New note',`<textarea class="form-input capture-input" id="capture-text" placeholder="${type==='task'?'What needs to get done?':type==='note'?'What would you like to remember?':'Write a task, thought or idea...'}"></textarea><div class="formrow"><label>Save as <span id="suggest-label" style="font-weight:500;color:#86928a">${type==='auto'?'(suggested automatically)':''}</span></label><div class="choice-pills"><button class="${selectedType==='task'?'active':''}" data-capture-type="task">${ico('tasks',14)} Task</button><button class="${selectedType==='note'?'active':''}" data-capture-type="note">${ico('notes',14)} Note</button></div></div><div class="formrow"><label for="capture-project">Project (optional)</label><select class="select" id="capture-project"><option value="">Inbox</option>${state.projects.map(p=>`<option value="${esc(p.id)}" ${p.id===projectId?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="modalfooter"><button class="btn" data-action="close-modal">Cancel</button><button class="btn primary" data-action="save-capture">Create ${selectedType}</button></div>`);const textarea=$('#capture-text');textarea.focus();let manual=type!=='auto';const updateType=()=>{$('#modal-root').dataset.captureType=selectedType;$$('#modal-root button[data-capture-type]').forEach(b=>b.classList.toggle('active',b.dataset.captureType===selectedType));$('#suggest-label').textContent=manual?'':'(suggested locally)';$('#modal-root [data-action="save-capture"]').textContent=`Create ${selectedType}`};textarea.addEventListener('input',()=>{if(!manual){selectedType=inferType(textarea.value);updateType()}});$('#modal-root').addEventListener('click',e=>{const b=e.target.closest('button[data-capture-type]');if(b){selectedType=b.dataset.captureType;manual=true;updateType()}});$('#modal-root').dataset.captureType const $$=s=>Array.from(document.querySelectorAll(s));
function modalPick(title,options,onChoice){showModal(title,`<div class="card">${options.length?options.map(({id,title,subtitle})=>`<button class="item-row" data-pick="${esc(id)}"><div class="item-body"><div class="item-title">${esc(title)}</div><div class="item-sub">${esc(subtitle||'')}</div></div>${ico('arrow',16)}</button>`).join(''):empty('No available items. Create one first.')}</div>`);$('#modal-root').addEventListener('click',e=>{const b=e.target.closest('[data-pick]');if(!b)return;const choice=b.dataset.pick;closeModal();onChoice(choice)})}
function saveTaskDetailField(target){const t=taskBy(route.split('/')[1]);if(!t)return;if(target.id==='task-title'){t.title=target.value||'Untitled task'}else if(target.id==='task-description')t.description=target.value;else if(target.id==='detail-project')t.projectId=target.value||null;else if(target.dataset.editSub){const s=t.subtasks.find(s=>s.id===target.dataset.editSub);if(s)s.text=target.value}touch(t);save()}
function saveNoteDetailField(target){const n=noteBy(route.split('/')[1]);if(!n)return;if(target.id==='note-title')n.title=target.value||'Untitled note';else if(target.id==='detail-project')n.projectId=target.value||null;else if(target.id==='note-editor')n.content=sanitizeHtml(target.innerHTML);touch(n);save();const info=$('#note-save-status');if(info)info.textContent='Saved automatically'}
function back(){if(route.startsWith('task/')||route.startsWith('note/')){const obj=route.startsWith('task/')?taskBy(route.split('/')[1]):noteBy(route.split('/')[1]);go(obj?.projectId?'project/'+obj.projectId:route.startsWith('task/')?'tasks':'notes')}else go('dashboard')}
function confirmAction(message){return window.confirm(message)}
function act(el){const a=el.dataset.action,tid=el.dataset.id;if(a==='capture')captureDialog();else if(a==='new-task')captureDialog('task',el.dataset.project||'');else if(a==='new-note')captureDialog('note',el.dataset.project||'');else if(a==='new-project')newProjectDialog();else if(a==='edit-project')newProjectDialog(projectBy(tid));else if(a==='back')back();else if(a==='close-modal')closeModal();else if(a==='open-task')go('task/'+tid);else if(a==='open-note')go('note/'+tid);else if(a==='toggle-task'){modify(()=>{const t=taskBy(tid);if(t){t.done=!t.done;touch(t)}})}else if(a==='filter-task'){taskFilter=tid;render()}else if(a==='project-tab'){projectTab=tid;render()}else if(a==='save-project'){const name=$('#project-name')?.value.trim();if(!name){showToast('Please enter a project name.');return}const description=$('#project-description')?.value.trim()||'';let p=projectBy(tid);if(p){p.name=name;p.description=description}else{p={id:id(),name,description,createdAt:now()};state.projects.push(p)}save();closeModal();go('project/'+p.id)}else if(a==='delete-project'){const p=projectBy(tid);if(!p)return;if(confirmAction(`Delete “${p.name}”? Its tasks and notes will be moved back to the Inbox.`)){state.projects=state.projects.filter(x=>x.id!==tid);for(const t of state.tasks)if(t.projectId===tid)t.projectId=null;for(const n of state.notes)if(n.projectId===tid)n.projectId=null;save();go('projects');showToast('Project deleted; its contents are safe in the Inbox.')}}else if(a==='save-capture'){const text=$('#capture-text')?.value.trim();if(!text){showToast('Type something to save.');return}const kind=$('#modal-root').dataset.captureType||inferType(text),pid=$('#capture-project')?.value||'';const o=kind==='task'?newTask(suggestedTitle(text),pid):newNote(suggestedTitle(text),text.split('\n').map(x=>`<p>${esc(x)}</p>`).join(''),pid);if(kind==='task'&&text.length>80){o.description=text;save()}closeModal();go(kind+'/'+o.id);showToast(kind==='task'?'Task created':'Note created')}else if(a==='delete-task'){if(confirmAction('Delete this task? This cannot be undone.')){state.tasks=state.tasks.filter(t=>t.id!==tid);save();go('tasks');showToast('Task deleted')}}else if(a==='delete-note'){if(confirmAction('Delete this note? The linked tasks will remain.')){const n=noteBy(tid);if(n?.audioId)deleteAudio(n.audioId);state.notes=state.notes.filter(n=>n.id!==tid);for(const t of state.tasks)t.noteIds=(t.noteIds||[]).filter(x=>x!==tid);save();go('notes');showToast('Note deleted')}}else if(a==='add-subtask'){const inp=$('#new-subtask'),text=inp?.value.trim();if(!text){inp?.focus();return}modify(()=>{const t=taskBy(tid);t.subtasks=t.subtasks||[];t.subtasks.push({id:id(),text,done:false});touch(t)});$('#new-subtask')?.focus()}else if(a==='toggle-subtask'){modify(()=>{const t=taskBy(tid),s=t?.subtasks.find(s=>s.id===el.dataset.sub);if(s){s.done=!s.done;touch(t)}})}else if(a==='remove-sub'){modify(()=>{const t=taskBy(tid);t.subtasks=t.subtasks.filter(s=>s.id!==el.dataset.sub);touch(t)})}else if(a==='move-sub'){modify(()=>{const t=taskBy(tid),i=t.subtasks.findIndex(s=>s.id===el.dataset.sub),j=i+Number(el.dataset.dir);if(i>=0&&j>=0&&j<t.subtasks.length){[t.subtasks[i],t.subtasks[j]]=[t.subtasks[j],t.subtasks[i]];touch(t)}})}else if(a==='link-note'){const t=taskBy(tid);const options=state.notes.filter(n=>!(t.noteIds||[]).includes(n.id)).map(n=>({id:n.id,title:n.title,subtitle:projectName(n.projectId)}));modalPick('Link a note',options,nid=>modify(()=>{t.noteIds=t.noteIds||[];t.noteIds.push(nid);touch(t)}))}else if(a==='link-task'){const n=noteBy(tid);const options=state.tasks.filter(t=>!(t.noteIds||[]).includes(n.id)).map(t=>({id:t.id,title:t.title,subtitle:projectName(t.projectId)}));modalPick('Link a task',options,tid=>modify(()=>{const t=taskBy(tid);t.noteIds=t.noteIds||[];t.noteIds.push(n.id);touch(t)}))}else if(a==='unlink-note'||a==='unlink-task'){modify(()=>{const t=taskBy(tid);t.noteIds=(t.noteIds||[]).filter(n=>n!==el.dataset.note);touch(t)})}else if(a==='linked-new-note'){const t=taskBy(tid),n=newNote('Untitled note','',t.projectId,t.id);go('note/'+n.id)}else if(a==='selection-to-task'){const n=noteBy(tid),editor=$('#note-editor'),sel=window.getSelection();const selected=sel?.toString()?.trim();if(!selected||!editor?.contains(sel.anchorNode)){showToast('Select text in your note, then tap “+ Task from text”.');return}const t=newTask(suggestedTitle(selected),n.projectId,n.id);if(selected.length>75){t.description=selected;save()}showToast('Linked task created');render()}else if(a==='voice')voiceDialog();else if(a==='voice-start')startVoice();else if(a==='voice-stop')stopVoice();else if(a==='voice-save')saveVoice();else if(a==='export')exportBackup();else if(a==='import')$('#import-file')?.click();else if(a==='clear-all'){if(confirmAction('Permanently erase ALL tasks, notes and projects in this browser? Export a backup first.')){state=emptyState();save();go('dashboard');showToast('All app data erased')}}}
function formatEditor(cmd){const editor=$('#note-editor');if(!editor)return;editor.focus();if(cmd==='h2')document.execCommand('formatBlock',false,'h2');else if(cmd==='checklist')document.execCommand('insertHTML',false,'<ul class="checklist"><li data-done="false">Checklist item</li></ul>');else if(cmd==='link'){const url=prompt('Link URL (https://...)');if(url&&/^https?:\/\//i.test(url.trim()))document.execCommand('createLink',false,url.trim());else if(url)showToast('Use a full https:// link.')}else document.execCommand(cmd,false,null);saveNoteDetailField(editor)}
// Browser-resident audio attachment storage (IndexedDB avoids localStorage limits).
const AUDIO_DB='commonplace-audio';let dbPromise=null;
function audioDB(){if(dbPromise)return dbPromise;dbPromise=new Promise((resolve,reject)=>{const req=indexedDB.open(AUDIO_DB,1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('recordings'))req.result.createObjectStore('recordings')};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});return dbPromise}
async function storeAudio(key,blob){const db=await audioDB();return new Promise((res,rej)=>{const tx=db.transaction('recordings','readwrite');tx.objectStore('recordings').put(blob,key);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
async function getAudio(key){const db=await audioDB();return new Promise((res,rej)=>{const r=db.transaction('recordings').objectStore('recordings').get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function deleteAudio(key){try{const db=await audioDB();db.transaction('recordings','readwrite').objectStore('recordings').delete(key)}catch{}}
async function showNoteAudio(key){const el=$('#audio-holder');if(!el)return;try{const blob=await getAudio(key);if(!blob){el.textContent='Audio attachment not present in this browser.';return}const url=URL.createObjectURL(blob);if(!el.isConnected){URL.revokeObjectURL(url);return}el.innerHTML=`<audio class="voice-player" controls preload="metadata" src="${url}"></audio>`}catch{el.textContent='Unable to open audio recording.'}}
function voiceDialog(){showModal('Voice capture',`<p class="lede" style="margin-bottom:14px">Speak your thoughts. Transcription is used when your browser supports it; otherwise you can save an audio note.</p><div class="voice-status" id="voice-status">Ready to record.</div><div class="formrow"><label for="voice-text">Editable transcript / note</label><textarea class="plain-textarea" id="voice-text" placeholder="Your spoken words will appear here, or type a note about the recording..."></textarea></div><div class="formrow"><label>Save as</label><div class="choice-pills"><button data-voice-kind="note" class="active">Note</button><button data-voice-kind="task">Task</button></div></div><div class="formrow"><label for="voice-project">Project (optional)</label><select class="select" id="voice-project"><option value="">Inbox</option>${state.projects.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}</select></div><div class="row"><button class="btn primary" data-action="voice-start" id="voice-start">${ico('mic',15)} Start recording</button><button class="btn" data-action="voice-stop" id="voice-stop" disabled>Stop</button></div><div id="voice-playback"></div><div class="modalfooter"><button class="btn" data-action="close-modal">Cancel</button><button class="btn primary" data-action="voice-save">Save</button></div>`);activeVoiceBlob=null;voiceTranscript='';$('#modal-root').dataset.voiceKind='note';$('#modal-root').addEventListener('click',e=>{const b=e.target.closest('[data-voice-kind]');if(!b)return;$('#modal-root').dataset.voiceKind=b.dataset.voiceKind;$$('[data-voice-kind]').forEach(x=>x.classList.toggle('active',x===b))});modalCleanup=()=>{try{activeSpeech?.stop()}catch{}try{if(activeRecorder?.state==='recording')activeRecorder.stop()}catch{}activeSpeech=null;activeRecorder=null}}
async function startVoice(){const status=$('#voice-status');if(!status)return;const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;$('#voice-start').disabled=true;$('#voice-stop').disabled=false;if(SpeechRecognition){try{const sr=new SpeechRecognition();activeSpeech=sr;sr.continuous=true;sr.interimResults=true;sr.lang=navigator.language||'en-US';voiceTranscript=$('#voice-text').value.trim();sr.onresult=e=>{let final='',interim='';for(let i=e.resultIndex;i<e.results.length;i++){const txt=e.results[i][0].transcript;if(e.results[i].isFinal)final+=txt+' ';else interim+=txt}voiceTranscript=(voiceTranscript+' '+final).trim();const el=$('#voice-text');if(el)el.value=(voiceTranscript+' '+interim).trim()};sr.onerror=e=>{if(status)status.textContent='Transcription unavailable: '+e.error+'. Try recording audio in this browser or type your note.';$('#voice-start').disabled=false;$('#voice-stop').disabled=true};sr.onend=()=>{if($('#voice-start'))$('#voice-start').disabled=false;if($('#voice-stop'))$('#voice-stop').disabled=true};sr.start();status.innerHTML='<span class="recording-dot"></span> Listening and transcribing...';return}catch{activeSpeech=null}}try{if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw Error('Microphone recording is not supported here.');const stream=await navigator.mediaDevices.getUserMedia({audio:true});if(!$('#voice-status')){stream.getTracks().forEach(t=>t.stop());return}const chunks=[];const mr=new MediaRecorder(stream);activeRecorder=mr;mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};mr.onstop=()=>{activeVoiceBlob=new Blob(chunks,{type:mr.mimeType||'audio/webm'});stream.getTracks().forEach(t=>t.stop());const el=$('#voice-playback');if(el){el.innerHTML='<p class="info-inline">Audio recorded and ready to save.</p><audio controls class="voice-player"></audio>';el.querySelector('audio').src=URL.createObjectURL(activeVoiceBlob)}const st=$('#voice-status');if(st)st.textContent='Recording complete. Save it as a note.'};mr.start();status.innerHTML='<span class="recording-dot"></span> Recording audio (transcription unavailable)...'}catch(e){status.textContent='Microphone unavailable: '+e.message+'. You can type a note instead.';$('#voice-start').disabled=false;$('#voice-stop').disabled=true}}
function stopVoice(){try{activeSpeech?.stop()}catch{}try{if(activeRecorder?.state==='recording')activeRecorder.stop()}catch{}const status=$('#voice-status');if(status&&activeSpeech)status.textContent='Transcription complete. Review and save.';if($('#voice-start'))$('#voice-start').disabled=false;if($('#voice-stop'))$('#voice-stop').disabled=true}
async function saveVoice(){stopVoice();const text=$('#voice-text')?.value.trim()||'',kind=$('#modal-root').dataset.voiceKind||'note',pid=$('#voice-project')?.value||'';if(!text&&!activeVoiceBlob){showToast('Record audio, speak, or type something first.');return}let audioId=null;if(activeVoiceBlob){audioId=id();try{await storeAudio(audioId,activeVoiceBlob)}catch{showToast('Unable to save audio. Check your browser storage.');return}}const target=kind==='task'?newTask(suggestedTitle(text||'Voice reminder'),pid):newNote(suggestedTitle(text||'Voice note'),text?`<p>${esc(text).replace(/\n/g,'</p><p>')}</p>`:'',pid,null,audioId);if(kind==='task'&&text.length>75){target.description=text;save()}if(kind==='task'&&audioId){const note=newNote('Voice recording for '+target.title,`<p>${esc(text)}</p>`,pid,target.id,audioId)}activeVoiceBlob=null;closeModal();go(kind+'/'+target.id);showToast('Voice capture saved')}
function blobToBase64(blob){return new Promise((res,rej)=>{const reader=new FileReader();reader.onload=()=>res(String(reader.result).split(',')[1]);reader.onerror=rej;reader.readAsDataURL(blob)})}
async function exportBackup(){const aud=[];for(const n of state.notes){if(n.audioId){try{const blob=await getAudio(n.audioId);if(blob)aud.push({id:n.audioId,type:blob.type,data:await blobToBase64(blob)})}catch{}}}const blob=new Blob([JSON.stringify({backupVersion:1,exportedAt:now(),data:state,audio:aud},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='commonplace-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);showToast('Backup downloaded')}
async function importBackup(file){try{const raw=JSON.parse(await file.text()),data=raw.data||raw;if(!Array.isArray(data.projects)||!Array.isArray(data.tasks)||!Array.isArray(data.notes))throw Error('Not a valid Commonplace backup');if(!confirmAction('Replace all current tasks, notes and projects with this backup?'))return;const cleaned={version:1,projects:data.projects.map(p=>({id:String(p.id),name:String(p.name),description:String(p.description||''),createdAt:p.createdAt||now()})),tasks:data.tasks.map(t=>({id:String(t.id),title:String(t.title||'Untitled task'),description:String(t.description||''),done:Boolean(t.done),projectId:t.projectId||null,subtasks:(Array.isArray(t.subtasks)?t.subtasks:[]).map(s=>({id:String(s.id),text:String(s.text||''),done:Boolean(s.done)})),noteIds:(Array.isArray(t.noteIds)?t.noteIds:[]).map(String),createdAt:t.createdAt||now(),updatedAt:t.updatedAt||now()})),notes:data.notes.map(n=>({id:String(n.id),title:String(n.title||'Untitled note'),content:sanitizeHtml(n.content),projectId:n.projectId||null,createdAt:n.createdAt||now(),updatedAt:n.updatedAt||now(),audioId:n.audioId||null}))};for(const a of (Array.isArray(raw.audio)?raw.audio:[])){if(a.id&&a.data&&a.data.length<70000000){const binary=atob(a.data),bytes=new Uint8Array(binary.length);for(let i=0;i<bytes.length;i++)bytes[i]=binary.charCodeAt(i);await storeAudio(a.id,new Blob([bytes],{type:a.type||'audio/webm'}))}}state=cleaned;save();go('dashboard');showToast('Backup restored successfully')}catch(e){showToast('Could not restore backup: '+e.message)}}
// Main event delegation: never re-render on each keystroke to preserve caret position.
document.addEventListener('click',e=>{const format=e.target.closest('[data-format]');if(format){e.preventDefault();formatEditor(format.dataset.format);return}const nv=e.target.closest('[data-nav]');if(nv){e.preventDefault();go(nv.dataset.nav);return}const action=e.target.closest('[data-action]');if(action){e.preventDefault();act(action)}});
document.addEventListener('mousedown',e=>{if(e.target.closest('[data-format]')||e.target.closest('[data-action="selection-to-task"]'))e.preventDefault()});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='search-input'){searchQ=el.value;searchResults(searchQ)}if(route.startsWith('task/')&&(el.id==='task-title'||el.id==='task-description'||el.dataset.editSub))saveTaskDetailField(el);if(route.startsWith('note/')&&(el.id==='note-title'||el.id==='note-editor'))saveNoteDetailField(el)});
document.addEventListener('change',e=>{if(e.target.id==='detail-project'){if(route.startsWith('task/'))saveTaskDetailField(e.target);else if(route.startsWith('note/'))saveNoteDetailField(e.target);showToast('Moved to '+projectName(e.target.value))}if(e.target.id==='import-file'&&e.target.files?.[0])importBackup(e.target.files[0])});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-action="open-task"],[data-action="open-note"]')){e.preventDefault();act(e.target)}if(e.key==='Enter'&&e.target.id==='new-subtask'){e.preventDefault();act($('[data-action="add-subtask"]'))}if(e.key==='Escape'&&$('#modal-overlay'))closeModal();if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();go('search');$('#search-input')?.focus()}});
document.addEventListener('click',e=>{const li=e.target.closest('#note-editor ul.checklist li');if(!li)return;const r=li.getBoundingClientRect();if(e.clientX>r.left+8)return;li.dataset.done=li.dataset.done==='true'?'false':'true';saveNoteDetailField($('#note-editor'))});
window.addEventListener('hashchange',()=>{route=location.hash.slice(1)||'dashboard';render()});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render();
})();
